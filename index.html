<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bibliografía - Pablo Mera & Vanina Vergara</title>
    <style>
        :root {
            --primary: #1a4d7a;
            --primary-light: #2a7cb5;
            --accent: #00d9ff;
            --accent-light: #4df5ff;
            --text: #ffffff;
            --text-secondary: #e0e0e0;
            --success: #00ff88;
            --warning: #ffaa00;
            --bg-gradient: linear-gradient(135deg, #0a1f3a 0%, #1a4d7a 50%, #0d2a47 100%);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            scroll-padding-top: var(--safe-top);
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: var(--safe-top);
            background: var(--bg-gradient);
            z-index: 10;
        }

        body {
            overflow-x: hidden;
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 16px calc(20px + var(--safe-bottom));
            background: var(--bg-gradient);
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
            letter-spacing: 2px;
            animation: fadeInDown 0.8s ease-out;
            text-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
            color: var(--accent);
            font-weight: 700;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main CTA Button */
        .main-cta {
            width: 280px;
            height: 80px;
            margin-bottom: 40px;
            perspective: 1000px;
            animation: scaleIn 0.6s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(0, 217, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 40px rgba(0, 217, 255, 0.1);
            background: linear-gradient(135deg, #0066cc 0%, #0099ff 100%);
        }

        .btn-3d:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .btn-3d:after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: sparkle 4s linear infinite;
        }

        @keyframes sparkle {
            0% { transform: translate(0, 0); }
            100% { transform: translate(25px, 25px); }
        }

        .btn-3d:hover {
            transform: translateY(-8px) rotateX(10deg);
            box-shadow: 
                0 20px 50px rgba(0, 217, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 60px rgba(0, 217, 255, 0.3);
        }

        .btn-3d:active {
            transform: translateY(-2px) rotateX(5deg);
        }

        .btn-3d img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 12px;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.3));
        }

        .btn-3d span {
            display: inline-block;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* Grid Table */
        .grid-container {
            width: 100%;
            max-width: 600px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid-item {
            aspect-ratio: 1;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateZ(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .grid-item:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 217, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .grid-item::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 15px 15px;
            animation: sparkle 5s linear infinite;
            z-index: 1;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .grid-item:hover img {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .grid-item a {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 12px;
            z-index: 2;
        }

        /* Language/Category Buttons */
        .button-row {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-category {
            flex: 1;
            height: 70px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1) 0%, rgba(0, 153, 255, 0.1) 100%);
            color: var(--accent);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .btn-category::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 15px 15px;
            animation: sparkle 4s linear infinite;
        }

        .btn-category:hover {
            transform: translateY(-6px);
            box-shadow: 
                0 10px 35px rgba(0, 217, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2) 0%, rgba(0, 153, 255, 0.2) 100%);
            border-color: var(--accent-light);
        }

        .btn-category span {
            position: relative;
            z-index: 2;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            .grid-container {
                gap: 12px;
                max-width: 100%;
            }

            .button-row {
                flex-wrap: wrap;
                margin-bottom: 20px;
            }

            .btn-category {
                flex: 0 1 calc(50% - 8px);
                height: 60px;
                font-size: 0.85rem;
            }

            .main-cta {
                width: 260px;
                height: 70px;
                margin-bottom: 30px;
            }

            .btn-3d {
                font-size: 0.95rem;
            }

            .btn-3d img {
                width: 50px;
                height: 50px;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.5rem;
            }

            .grid-container {
                gap: 10px;
            }

            .main-cta {
                width: 240px;
                height: 65px;
            }

            .btn-category {
                height: 55px;
                font-size: 0.75rem;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
