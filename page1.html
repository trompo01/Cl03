<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliografía - Bibliography</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 25px 15px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 3px solid #00ff88;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 30px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 650px;
            width: 100%;
            perspective: 1000px;
            grid-template-rows: repeat(4, 1fr);
        }

        @media (max-width: 480px) {
            .table-grid {
                gap: 12px;
                max-width: 95vw;
            }
            header {
                padding: 20px 10px;
            }
        }

        .button-3d {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border: 3px solid #00ff88;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.25), inset 0 0 20px rgba(255, 0, 110, 0.05);
            background: rgba(0, 20, 40, 0.7);
        }

        .button-3d:hover {
            transform: translateY(-12px) rotateX(12deg) rotateY(10deg) scale(1.08);
            box-shadow: 0 20px 50px rgba(0, 255, 136, 0.6), inset 0 0 30px rgba(255, 0, 110, 0.2);
            border-color: #ff006e;
        }

        .button-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.75) contrast(1.3) saturate(1.1);
            transition: all 0.3s ease;
        }

        .button-3d:hover img {
            filter: brightness(1) contrast(1.4) saturate(1.3);
        }

        .button-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.98), transparent);
            color: #00ff88;
            padding: 15px 10px 8px;
            text-align: center;
            font-weight: bold;
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            border-top: 2px solid #ff006e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .language-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 500px;
        }

        .lang-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid #00ff88;
            background: rgba(0, 20, 40, 0.8);
            color: #00ff88;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.2);
        }

        .lang-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.5);
            border-color: #ff006e;
            color: #ff006e;
        }

        .lang-flag {
            display: inline-block;
            width: 30px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
            vertical-align: middle;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid #00ff88;
            font-size: 0.8rem;
            color: #888;
        }

        @keyframes sparkle {
            0%, 100% {
                box-shadow: 0 6px 20px rgba(0, 255, 136, 0.2);
            }
            50% {
                box-shadow: 0 8px 30px rgba(255, 0, 110, 0.4);
            }
        }

        .lang-btn {
            animation: sparkle 2s infinite;
        }
    </style>
</head>
<body>
    <audio id="bgmusic" autoplay loop>
        <source src="kelvin.aac" type="audio/aac">
    </audio>

    <header>
        <h1>📚 BIBLIOGRAFÍA</h1>
    </header>

    <div class="container">
        <div class="table-grid">
            <!-- Row 1 -->
            <a href="page2.html" class="button-3d">
                <img src="vesp.jpg" alt="Cuando la familia se rompe">
                <span class="button-label">ESP 1</span>
            </a>
            <a href="page3.html" class="button-3d">
                <img src="pesp.jpg" alt="Manual Inadaptado">
                <span class="button-label">ESP 2</span>
            </a>

            <!-- Row 2 -->
            <a href="page4.html" class="button-3d">
                <img src="lamp.jpg" alt="Jardín de los que volvieron">
                <span class="button-label">ESP 3</span>
            </a>
            <a href="page5.html" class="button-3d">
                <img src="EJDL.jpg" alt="Jardín de Luma">
                <span class="button-label">ESP 4</span>
            </a>

            <!-- Row 3 -->
            <a href="page6.html" class="button-3d">
                <img src="crc.jpg" alt="Caracol Menú de Autor">
                <span class="button-label">ESP 5</span>
            </a>
            <a href="page7.html" class="button-3d">
                <img src="CRCENG.png" alt="Caracol Author's Menu">
                <span class="button-label">ENG 1</span>
            </a>

            <!-- Row 4 -->
            <a href="page8.html" class="button-3d">
                <img src="veng.jpg" alt="When Families Fracture">
                <span class="button-label">ENG 2</span>
            </a>
            <a href="page9.html" class="button-3d">
                <img src="peng.jpg" alt="Lucid Misfit's Handbook">
                <span class="button-label">ENG 3</span>
            </a>
        </div>

        <div class="language-buttons">
            <a href="page2.html" class="lang-btn">
                🇪🇸 ESPAÑOL
            </a>
            <a href="page7.html" class="lang-btn">
                🇬🇧 ENGLISH
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bibliografía | All Rights Reserved</p>
    </footer>

    <script>
        document.getElementById('bgmusic').volume = 0.3;
    </script>
</body>
</html>
